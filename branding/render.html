<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Georgia:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;300;400&display=swap');
    
    body, * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    
    body {
      background: #340825; /* Original BG */
      overflow: hidden;
    }
    
    #canvas {
      width: 1280px;
      height: 640px;
      position: relative;
      background: #340825;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 110px;
      overflow: hidden;
    }
    
    #background-curves {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 640px;
      z-index: 1;
      pointer-events: none;
    }
    
    #content-left {
      display: flex;
      align-items: center;
      z-index: 2;
    }
    
    #logo-container {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    
    #logo-triangle {
      width: 109px;  /* Triangle width to ensure height is exactly 82px */
      height: 82px;
    }
    
    #logo-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 110px; /* Adjusted to match the 82px triangle height perfectly */
      color: #FCFAF2;
      letter-spacing: 5px;
      line-height: 0.8;
      margin-top: 5px;
    }
    
    #content-right {
      flex: 1;
      max-width: 700px;
      text-align: left;
      padding-left: 80px;
      z-index: 2;
    }
    
    #title-text {
      font-family: 'Georgia', serif;
      font-size: 50px;
      font-weight: 700;
      line-height: 1.15;
      color: #FCFAF2;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }
    
    #subtitle-text {
      font-family: 'Georgia', serif;
      font-size: 34px;
      font-weight: 400;
      font-style: italic;
      color: #FCFAF2;
      opacity: 0.85;
      margin-top: 20px;
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div id="canvas">
    <svg id="background-curves" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg"></svg>
    
    <div id="content-left">
      <div id="logo-container">
        <!-- SAIR Logo Triangle: ViewBox bounds the triangle perfectly to match height -->
        <svg id="logo-triangle" viewBox="0 15 100 75" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Vertical fade: bottom is bright white, top is faint -->
            <linearGradient id="vertical-fade" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#FCFAF2" stop-opacity="1" />
              <stop offset="100%" stop-color="#FCFAF2" stop-opacity="0.15" />
            </linearGradient>

            <!-- Mask for lines OUTSIDE the incircle (Thick lines) -->
            <mask id="thick-mask">
              <rect x="0" y="0" width="100" height="100" fill="white" />
              <circle cx="50" cy="66" r="24" fill="black" />
            </mask>

            <!-- Mask for lines INSIDE the incircle (Thin lines) -->
            <mask id="thin-mask">
              <rect x="0" y="0" width="100" height="100" fill="black" />
              <circle cx="50" cy="66" r="24" fill="white" />
            </mask>
          </defs>
          
          <g mask="url(#thick-mask)" id="logo-bars-thick" fill="url(#vertical-fade)"></g>
          <g mask="url(#thin-mask)" id="logo-bars-thin" fill="url(#vertical-fade)"></g>
        </svg>
        <div id="logo-text">SAIR</div>
      </div>
    </div>
    
    <div id="content-right">
      <div id="title-text">Modular Arithmetic<br>Challenge</div>
      <div id="subtitle-text">Research Repository</div>
    </div>
  </div>
  
  <script>
    const logoBarsThick = document.getElementById('logo-bars-thick');
    const logoBarsThin = document.getElementById('logo-bars-thin');
    let thickHtml = '';
    let thinHtml = '';
    
    const numBars = 16;
    const startY = 15;
    const endY = 90;
    const height = endY - startY;
    const barSpacing = height / numBars;
    
    const thickFactor = 0.38; // Thick edges outside circle
    const thinFactor = 0.05;  // Thin lines inside circle
    const baseHalfWidth = 40;

    for (let i = 0; i < numBars; i++) {
      const y_top = startY + i * barSpacing;
      
      const hw_top = ((y_top - startY) / height) * baseHalfWidth;
      const x1 = 50 - hw_top;
      const x2 = 50 + hw_top;
      
      // Calculate thick bar
      const y_bottom_thick = y_top + barSpacing * thickFactor;
      const hw_bottom_thick = ((y_bottom_thick - startY) / height) * baseHalfWidth;
      const x3_thick = 50 + hw_bottom_thick;
      const x4_thick = 50 - hw_bottom_thick;
      thickHtml += `<polygon points="${x1},${y_top} ${x2},${y_top} ${x3_thick},${y_bottom_thick} ${x4_thick},${y_bottom_thick}" />\n`;

      // Calculate thin bar
      const y_top_thin = y_top + (barSpacing * thickFactor / 2) - (barSpacing * thinFactor / 2);
      const y_bottom_thin = y_top_thin + barSpacing * thinFactor;
      
      const hw_top_thin = ((y_top_thin - startY) / height) * baseHalfWidth;
      const hw_bottom_thin = ((y_bottom_thin - startY) / height) * baseHalfWidth;
      
      const x1_thin = 50 - hw_top_thin;
      const x2_thin = 50 + hw_top_thin;
      const x3_thin = 50 + hw_bottom_thin;
      const x4_thin = 50 - hw_bottom_thin;
      thinHtml += `<polygon points="${x1_thin},${y_top_thin} ${x2_thin},${y_top_thin} ${x3_thin},${y_bottom_thin} ${x4_thin},${y_bottom_thin}" />\n`;
    }
    
    logoBarsThick.innerHTML = thickHtml;
    logoBarsThin.innerHTML = thinHtml;
    
    const bgSvg = document.getElementById('background-curves');
    // Using blue and purple for lines
    for (let i = 0; i < 45; i++) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const startX = 550 + i * 18;
      const startY = 640;
      const cp1x = 950 - i * 6;
      const cp1y = 400 - i * 11;
      const cp2x = 1050 + i * 10;
      const cp2y = 120 + i * 4;
      const endX = 1280;
      const endY = 280 - i * 9;
      
      path.setAttribute('d', `M ${startX} ${startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`);
      path.setAttribute('stroke', 'rgba(252, 250, 242, 0.055)');
      path.setAttribute('stroke-width', '1.2');
      path.setAttribute('fill', 'none');
      bgSvg.appendChild(path);
    }
    
    for (let i = 0; i < 30; i++) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const startX = 1280;
      const startY = -20 + i * 18;
      const cp1x = 850 - i * 9;
      const cp1y = 180 + i * 13;
      const cp2x = 750 - i * 6;
      const cp2y = 480 - i * 3;
      const endX = 350 + i * 22;
      const endY = 640;
      
      path.setAttribute('d', `M ${startX} ${startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`);
      path.setAttribute('stroke', 'rgba(252, 250, 242, 0.035)');
      path.setAttribute('stroke-width', '0.9');
      path.setAttribute('fill', 'none');
      bgSvg.appendChild(path);
    }
  </script>
</body>
</html>
