<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="A neural network computing a times b mod p one digit at a time, showing the running remainder staying the width of the prime while the operands grow">
<rect width="1200" height="440" fill="#FAFBFC"/>
<rect x="0" y="0" width="10" height="440" fill="#3949AB"/>
<text x="56" y="62" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#3949AB" font-weight="600" text-anchor="start" letter-spacing="0.34em">EXACT ARITHMETIC, LEARNED</text>
<text x="56" y="104" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#12141A" font-weight="600" text-anchor="start">(a × b) mod p, with no arithmetic in the code</text>
<text x="56" y="136" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#4A5663" font-weight="400" text-anchor="start">Operands run to hundreds of digits. Every answer is exact or it is wrong.</text>
<rect x="56" y="186" width="300" height="176" rx="10" fill="#FFFFFF" stroke="#D8DEE6"/>
<text x="80" y="218" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7684" font-weight="600" text-anchor="start" letter-spacing="0.28em">GIVEN</text>
<text x="80" y="254" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" fill="#6B7684" font-weight="400" text-anchor="start">a</text>
<text x="112" y="254" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20" fill="#12141A" font-weight="500" text-anchor="start">4821</text>
<text x="80" y="288" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" fill="#6B7684" font-weight="400" text-anchor="start">b</text>
<text x="112" y="288" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20" fill="#12141A" font-weight="500" text-anchor="start">7396</text>
<text x="80" y="322" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" fill="#6B7684" font-weight="400" text-anchor="start">p</text>
<text x="112" y="322" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20" fill="#12141A" font-weight="500" text-anchor="start">1009</text>
<text x="196" y="254" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start">hundreds of digits</text>
<text x="196" y="288" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start">hundreds of digits</text>
<text x="196" y="322" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6B7684" font-weight="400" text-anchor="start">prime, and shorter</text>
<rect x="392" y="186" width="752" height="176" rx="10" fill="#FFFFFF" stroke="#D8DEE6"/>
<text x="418" y="218" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3949AB" font-weight="600" text-anchor="start" letter-spacing="0.28em">SCRATCHPAD</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="0.0s" repeatCount="indefinite"/><text x="418" y="268" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26" fill="#12141A" font-weight="500" text-anchor="start">4821 × 7396</text><text x="418" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5663" font-weight="400" text-anchor="start">the operands, as decimal strings</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="1.5s" repeatCount="indefinite"/><text x="418" y="268" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26" fill="#12141A" font-weight="500" text-anchor="start">= 35656116</text><text x="418" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5663" font-weight="400" text-anchor="start">the product, 8 digits wide</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="3.0s" repeatCount="indefinite"/><text x="418" y="268" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26" fill="#12141A" font-weight="500" text-anchor="start">3565 mod 1009 → 538</text><text x="418" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5663" font-weight="400" text-anchor="start">take the next digit, reduce, keep going</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="4.5s" repeatCount="indefinite"/><text x="418" y="268" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26" fill="#12141A" font-weight="500" text-anchor="start">5386 mod 1009 → 341</text><text x="418" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5663" font-weight="400" text-anchor="start">take the next digit, reduce, keep going</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="6.0s" repeatCount="indefinite"/><text x="418" y="268" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26" fill="#12141A" font-weight="500" text-anchor="start">3841 mod 1009 → 814</text><text x="418" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5663" font-weight="400" text-anchor="start">take the next digit, reduce, keep going</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="7.5s" repeatCount="indefinite"/><text x="418" y="268" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26" fill="#2EA043" font-weight="500" text-anchor="start">ANS = 74</text><text x="418" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#4A5663" font-weight="400" text-anchor="start">one answer, exactly right or wrong</text></g>
<rect x="418" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0.2"/>
<rect x="418" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="0.0s" repeatCount="indefinite"/></rect>
<rect x="444" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0.2"/>
<rect x="444" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="1.5s" repeatCount="indefinite"/></rect>
<rect x="470" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0.2"/>
<rect x="470" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="3.0s" repeatCount="indefinite"/></rect>
<rect x="496" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0.2"/>
<rect x="496" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="4.5s" repeatCount="indefinite"/></rect>
<rect x="522" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0.2"/>
<rect x="522" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="6.0s" repeatCount="indefinite"/></rect>
<rect x="548" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0.2"/>
<rect x="548" y="330" width="18" height="4" rx="2" fill="#3949AB" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.15;0.17" dur="9.0s" begin="7.5s" repeatCount="indefinite"/></rect>
<text x="700" y="334" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6B7684" font-weight="400" text-anchor="start">the remainder never grows past the width of p</text>
<path d="M 56 406 H 1144" stroke="#D8DEE6"/>
<text x="56" y="428" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#6B7684" font-weight="400" text-anchor="start">The answer has to come from trained parameters. Native big-integer arithmetic on the inputs is disqualifying.</text>
</svg>